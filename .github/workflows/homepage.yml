name: Publish homepage and refresh citations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homepage.yml
      - scripts/update_citations.py
      - scripts/render_publications.py
      - data/publications.json
      - index.html
      - assets/**
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

concurrency:
  group: homepage-publication
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update OpenAlex citations
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 scripts/update_citations.py
      - name: Render publications
        run: python3 scripts/render_publications.py
      - name: Save refreshed snapshot
        run: |
          git add data/publications.json index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh OpenAlex citation counts'
            git push origin HEAD:main
          fi
      - name: Stage public files
        run: |
          mkdir -p "$RUNNER_TEMP/homepage"
          cp -R index.html assets data "$RUNNER_TEMP/homepage/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/homepage
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
